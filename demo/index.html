<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bora · Regras ao vivo</title>
<meta name="description" content="O banco real do Bora rodando no navegador: RLS por secretaria, funções security definer e gatilhos de notificação.">
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#17201b;--muted:#5a665f;--line:#d8ded9;--brand:#0f7b53;--brand-soft:#e2f2ea;--deny:#a33a2a;--deny-soft:#fbe9e5;--code:#121815;--code-ink:#e5ece8}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--brand)}
button,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:62px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.5px}
.brand small{font-weight:600;font-size:13px;color:var(--muted);margin-left:6px}
.lang{display:flex;border:1px solid var(--line);border-radius:30px;padding:3px}
.lang button{border:0;background:none;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.intro{padding:34px 0 10px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-1px;margin:0 0 12px}
.lead{max-width:780px;color:var(--muted);margin:0 0 16px}
.status{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px;margin:0 0 14px}
.dot{width:10px;height:10px;border-radius:50%;background:#c9a227;flex:none}
.status.ready .dot{background:var(--brand)}
.status.error .dot{background:var(--deny)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
section.scenario{margin:22px 0 8px}
section.scenario>h2{font-size:22px;letter-spacing:-.4px;margin:0 0 4px}
section.scenario>p{margin:0 0 12px;color:var(--muted);max-width:820px}
.step{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.step-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.step h3{font-size:16px;margin:0}
.who{display:inline-block;font-size:12px;font-weight:700;background:#eef1ef;border-radius:20px;padding:2px 10px;color:var(--muted);margin-top:4px}
.note{margin:6px 0 0;color:var(--muted);font-size:14px}
pre{margin:10px 0 0;background:var(--code);color:var(--code-ink);border-radius:6px;padding:10px 12px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.result{margin-top:10px;border-radius:6px;padding:10px 12px;font-size:14px}
.result.ok{background:var(--brand-soft)}
.result.denied{background:var(--deny-soft)}
.result strong{display:block;margin-bottom:4px}
.result.ok strong{color:var(--brand)}
.result.denied strong{color:var(--deny)}
.expect{font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px}
.expect.match{background:var(--brand-soft);color:var(--brand)}
.expect.miss{background:var(--deny-soft);color:var(--deny)}
table{border-collapse:collapse;font-size:13px;width:100%;margin-top:4px;background:#fff}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.err{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.playground{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:26px 0}
.playground h2{margin:0 0 4px;font-size:20px}
.playground p{margin:0 0 10px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:6px;padding:10px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
select{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff}
footer{border-top:1px solid var(--line);padding:18px 0 32px;color:var(--muted);font-size:13px}
@media(max-width:640px){.step-head{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand">Bora<small data-i18n="tag"></small></div>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="pt" lang="pt-BR">PT</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="intro">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 data-i18n="title"></h1>
    <p class="lead" data-i18n="lead"></p>
    <p class="status" id="status" role="status"><span class="dot" aria-hidden="true"></span><span id="status-text"></span></p>
    <div class="actions">
      <button class="btn primary" type="button" id="run-all" disabled data-i18n="runAll"></button>
      <button class="btn" type="button" id="reset" disabled data-i18n="reset"></button>
      <a class="btn" href="https://github.com/acamilateixeira/Bora" target="_blank" rel="noopener" data-i18n="code"></a>
    </div>
  </section>
  <div id="scenarios"></div>
  <section class="playground" aria-labelledby="play-title">
    <h2 id="play-title" data-i18n="playTitle"></h2>
    <p data-i18n="playLead"></p>
    <div class="row">
      <label for="play-as" data-i18n="playAs"></label>
      <select id="play-as"></select>
      <button class="btn primary" type="button" id="play-run" disabled data-i18n="run"></button>
    </div>
    <label for="play-sql" class="sr" hidden>SQL</label>
    <textarea id="play-sql" spellcheck="false">select o.name as secretaria, r.status, count(*) as corridas
from requests r join orgs o on o.id = r.org_id
group by 1, 2 order by 1, 2</textarea>
    <div id="play-result" aria-live="polite"></div>
  </section>
</main>
<footer class="wrap" data-i18n="footer"></footer>
<script type="module">
import { PGLITE_VERSION, createDatabase, freeStep, runStep } from './engine.mjs';
import { PEOPLE, SCENARIOS, verdict } from './scenarios.mjs';

const text = {
  pt: {
    tag: 'regras ao vivo', eyebrow: 'Demo no navegador', title: 'O banco do Bora rodando aqui, com as regras de verdade',
    lead: 'O app de corridas da Prefeitura de Conceição do Mato Dentro fala direto com o Supabase usando a chave pública. Por isso toda regra de acesso mora no banco. Esta página carrega o schema e as migrações do repositório em um Postgres compilado para WebAssembly (PGlite) e executa cada passo como a pessoa indicada.',
    loading: 'Carregando Postgres no navegador e aplicando o schema do app…', ready: (n) => `Banco pronto: schema, migrações e seed de exemplo do repositório (${n} tabelas).`, failed: 'Não foi possível iniciar o banco neste navegador.',
    runAll: 'Executar todos os passos', reset: 'Recomeçar do zero', code: 'Ver o código ↗', run: 'Executar',
    as: 'como', expectOk: 'esperado: permitido', expectDenied: 'esperado: recusado', matched: '✓ como esperado', missed: '✗ diferente do esperado',
    allowed: 'Permitido', denied: 'Recusado pelo banco', rows: (n) => `${n} linha(s)`, empty: 'Nenhuma linha visível para esta pessoa.',
    playTitle: 'Experimente', playLead: 'Escreva um SELECT, INSERT ou UPDATE e rode como uma das pessoas. A RLS decide o que aparece.', playAs: 'Rodar como',
    footer: 'Dados fictícios do seed. Push, Vault e pg_net são substituídos pelos mesmos stubs dos testes do repositório; o restante é o SQL do app sem alterações.',
  },
  en: {
    tag: 'live rules', eyebrow: 'In-browser demo', title: 'Bora’s database running here, with the real rules',
    lead: 'The ride app built for the city of Conceição do Mato Dentro talks straight to Supabase with the public key, so every access rule lives in the database. This page loads the repository schema and migrations into Postgres compiled to WebAssembly (PGlite) and runs each step as the person shown.',
    loading: 'Loading Postgres in the browser and applying the app schema…', ready: (n) => `Database ready: the repository schema, migrations and sample seed (${n} tables).`, failed: 'Could not start the database in this browser.',
    runAll: 'Run every step', reset: 'Start over', code: 'View the code ↗', run: 'Run',
    as: 'as', expectOk: 'expected: allowed', expectDenied: 'expected: refused', matched: '✓ as expected', missed: '✗ not as expected',
    allowed: 'Allowed', denied: 'Refused by the database', rows: (n) => `${n} row(s)`, empty: 'No rows visible to this person.',
    playTitle: 'Try it', playLead: 'Write a SELECT, INSERT or UPDATE and run it as one of the people. RLS decides what shows up.', playAs: 'Run as',
    footer: 'Fictional seed data. Push, Vault and pg_net are replaced by the same stubs the repository tests use; the rest is the app SQL unchanged.',
  },
};
const params = new URLSearchParams(location.search);
let lang = params.get('lang') === 'en' || (!params.get('lang') && !navigator.language?.toLowerCase().startsWith('pt')) ? 'en' : 'pt';
let db = null;
let tables = 0;
let state = 'loading';
let next = 0; // índice do próximo passo
const steps = SCENARIOS.flatMap((s) => s.steps.map((step) => ({ ...step, scenario: s.id })));
const outcomes = new Map();

const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function resultHtml(outcome, step) {
  const t = text[lang];
  if (!outcome) return '';
  if (!outcome.ok) {
    return `<div class="result denied"><strong>${t.denied}</strong><span class="err">${esc(outcome.code)} ${esc(outcome.message)}</span></div>`;
  }
  const rows = outcome.rows;
  const cols = rows.length ? Object.keys(rows[0]) : [];
  const table = rows.length
    ? `<table><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td>${esc(typeof r[c] === 'object' && r[c] !== null ? JSON.stringify(r[c]) : r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`
    : `<span>${t.empty}</span>`;
  return `<div class="result ok"><strong>${t.allowed} · ${t.rows(rows.length)} · ${outcome.ms} ms</strong>${table}</div>`;
}

function render() {
  const t = text[lang];
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = typeof t[el.dataset.i18n] === 'string' ? t[el.dataset.i18n] : ''; });
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  const status = document.getElementById('status');
  status.className = `status ${state === 'ready' ? 'ready' : state === 'error' ? 'error' : ''}`;
  document.getElementById('status-text').textContent = state === 'ready' ? t.ready(tables) : state === 'error' ? t.failed : t.loading;
  const busy = state !== 'ready';
  document.getElementById('run-all').disabled = busy || next >= steps.length;
  document.getElementById('reset').disabled = busy;
  document.getElementById('play-run').disabled = busy;
  const select = document.getElementById('play-as');
  const chosen = select.value || 'rider';
  select.innerHTML = Object.entries(PEOPLE).map(([key, p]) => `<option value="${key}">${esc(p.name[lang])}</option>`).join('');
  select.value = chosen;

  document.getElementById('scenarios').innerHTML = SCENARIOS.map((scenario) => `
    <section class="scenario" id="${scenario.id}">
      <h2>${esc(scenario.title[lang])}</h2>
      <p>${esc(scenario.summary[lang])}</p>
      ${scenario.steps.map((step) => {
        const index = steps.findIndex((s) => s.scenario === scenario.id && s.title.pt === step.title.pt);
        const outcome = outcomes.get(index);
        const match = outcome ? verdict(step, outcome) : null;
        return `<article class="step">
          <div class="step-head">
            <div><h3>${index + 1}. ${esc(step.title[lang])}</h3><span class="who">${t.as} ${esc(PEOPLE[step.as].name[lang])}</span></div>
            <div>${outcome ? `<span class="expect ${match ? 'match' : 'miss'}">${match ? t.matched : t.missed}</span>` : `<span class="expect">${step.expect === 'denied' ? t.expectDenied : t.expectOk}</span>`}
            ${!outcome ? `<button class="btn" type="button" data-step="${index}" ${busy || index !== next ? 'disabled' : ''}>${t.run}</button>` : ''}</div>
          </div>
          ${step.note ? `<p class="note">${esc(step.note[lang])}</p>` : ''}
          <pre>${esc(step.sql)}</pre>
          ${resultHtml(outcome, step)}
        </article>`;
      }).join('')}
    </section>`).join('');
  document.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => runNext()));
}

async function runNext() {
  if (!db || next >= steps.length) return;
  const index = next;
  outcomes.set(index, await runStep(db, steps[index]));
  next++;
  render();
}

async function boot() {
  state = 'loading'; outcomes.clear(); next = 0; render();
  try {
    const { PGlite } = await import(`https://cdn.jsdelivr.net/npm/@electric-sql/pglite@${PGLITE_VERSION}/dist/index.js`);
    db = await createDatabase(PGlite, async (file) => {
      const response = await fetch(file);
      if (!response.ok) throw new Error(`${file}: ${response.status}`);
      return response.text();
    });
    const count = await db.query(`select count(*)::int as n from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE'`);
    tables = count.rows[0].n;
    state = 'ready';
  } catch (error) {
    console.error(error);
    state = 'error';
  }
  render();
}

document.getElementById('run-all').addEventListener('click', async () => { while (next < steps.length) await runNext(); });
document.getElementById('reset').addEventListener('click', async () => { await db?.close?.(); db = null; await boot(); });
document.getElementById('play-run').addEventListener('click', async () => {
  const as = document.getElementById('play-as').value;
  const sql = document.getElementById('play-sql').value;
  const outcome = await runStep(db, freeStep(as, sql));
  document.getElementById('play-result').innerHTML = resultHtml(outcome);
});
document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  history.replaceState(null, '', `?lang=${lang}${location.hash}`);
  render();
}));

boot();
</script>
</body>
</html>
